<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PromptLab · Taller de instrucciones a la IA</title>
  <meta name="description" content="Actividades interactivas para practicar cómo dar instrucciones a la IA, aprender con ella y crear una startup. 5.º año, Ciclo Orientado en Economía." />
  <link rel="icon" type="image/svg+xml" href="assets/img/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="blobs" aria-hidden="true"><span></span><span></span><span></span></div>

  <!-- ===== SELECTOR DE IDIOMA (siempre visible, arriba a la derecha) ===== -->
  <div class="lang" id="lang">
    <button class="lang-btn" id="lang-btn" aria-haspopup="true" aria-expanded="false" data-i18n-title="lang.label">🌐 <span id="lang-current">ES</span> ▾</button>
    <div class="lang-menu" id="lang-menu" role="menu"></div>
  </div>

  <header id="topbar" class="topbar hidden">
    <button class="brand" id="btn-home" data-i18n-title="top.home">
      <img src="assets/img/logo.svg" alt="" /> <span>PromptLab</span>
    </button>
    <div class="badges" id="top-badges" aria-label="Insignias"></div>
    <div class="top-right">
      <div class="who"><small data-i18n="top.student">Estudiante</small><b id="top-name">—</b></div>
      <div class="clock" id="top-clock" data-i18n-title="top.clock">00:00</div>
      <button class="icon-btn" id="btn-menu" data-i18n-title="top.menu">⚙️</button>
    </div>
  </header>

  <main id="app">
    <!-- BIENVENIDA -->
    <section id="screen-welcome" class="screen active">
      <div class="hero">
        <img src="assets/img/nova.svg" alt="Nova, la guía del laboratorio" class="hero-nova" />
        <div>
          <p class="kicker" data-i18n="w.kicker"></p>
          <h1>Prompt<span>Lab</span></h1>
          <p class="lead" data-i18n="w.lead"></p>
        </div>
      </div>

      <div class="cards3">
        <div class="mcard c1"><img src="assets/img/m1.svg" alt="" /><h3 data-i18n="w.c1t"></h3><p data-i18n="w.c1d"></p><span id="mc-m1-min"></span></div>
        <div class="mcard c2"><img src="assets/img/m2.svg" alt="" /><h3 data-i18n="w.c2t"></h3><p data-i18n="w.c2d"></p><span id="mc-m2-min"></span></div>
        <div class="mcard c3"><img src="assets/img/m3.svg" alt="" /><h3 data-i18n="w.c3t"></h3><p data-i18n="w.c3d"></p><span id="mc-m3-min"></span></div>
      </div>

      <form id="form-name" class="panel name-panel" autocomplete="off">
        <label for="input-name" data-i18n="w.nameLabel"></label>
        <div class="row nowrap">
          <input id="input-name" type="text" maxlength="40" data-i18n-ph="w.namePh" required />
          <button class="btn primary" type="submit" data-i18n="w.enter"></button>
        </div>
        <small data-i18n="w.nameHelp"></small>
      </form>

      <div id="resume" class="panel hidden">
        <p id="resume-text"></p>
        <div class="row">
          <button class="btn primary" id="btn-resume" data-i18n="w.continue"></button>
          <button class="btn ghost" id="btn-new" data-i18n="w.new"></button>
        </div>
      </div>
    </section>

    <!-- MAPA -->
    <section id="screen-hub" class="screen">
      <div class="nova-says">
        <img src="assets/img/nova.svg" alt="" />
        <div class="bubble" id="hub-bubble"></div>
      </div>
      <div class="agenda" id="agenda"></div>
      <div class="hub-grid" id="hub-grid"></div>
    </section>

    <!-- MOMENTO (contenido dinámico) -->
    <section id="screen-stage" class="screen">
      <div class="stage-head">
        <img id="stage-icon" src="" alt="" />
        <div class="grow">
          <p class="kicker" id="stage-kicker"></p>
          <h2 id="stage-title"></h2>
        </div>
        <div class="stage-timer" id="stage-timer" data-i18n-title="st.timer"></div>
        <button class="btn ghost small" id="btn-hub" data-i18n="st.map"></button>
      </div>
      <div class="steps" id="stage-steps"></div>
      <div id="stage-body"></div>
    </section>

    <!-- BITÁCORA -->
    <section id="screen-log" class="screen">
      <div id="log-body"></div>
    </section>
  </main>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-box"><div id="modal-content"></div><div class="row center" id="modal-actions"></div></div>
  </div>
  <div id="toast" class="toast"></div>
  <footer class="foot" id="foot"></footer>

  <script src="js/data.js"></script>
  <script src="js/data.fr.js"></script>
  <script src="js/data.en.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/card.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
